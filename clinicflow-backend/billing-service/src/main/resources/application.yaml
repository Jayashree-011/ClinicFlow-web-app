server:
  port: 8089

spring:
  config:
    import: optional:configserver:http://localhost:8701
  application:
    name: billing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: clinicflow-secret-key-for-jwt-token-generation-and-validation
  expiration: 86400000

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8710/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "/api/billing/**"
