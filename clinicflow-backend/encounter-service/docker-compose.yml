version: '3.8'

services:
  mysql:
    image: mysql:8.0-debian
    container_name: clinicflow-encounter-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinicflow_encounter
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  encounter-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicflow-encounter-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clinicflow_encounter
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/encounter-service/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - clinicflow-network

volumes:
  mysql_data:
    driver: local

networks:
  clinicflow-network:
    driver: bridge
