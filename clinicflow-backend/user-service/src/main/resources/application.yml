server:
  port: 0

spring:
  config:
    import: optional:configserver:http://localhost:8701
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: clinicflow-secret-key-for-jwt-token-generation-and-validation
  expiration: 86400000

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://localhost:8710/eureka/

management:
  endpoints:
    web:
      base-path: /api/auth/actuator
      exposure:
        include: 'health,info'
